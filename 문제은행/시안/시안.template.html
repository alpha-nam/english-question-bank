<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 문제은행 시안 v12</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* ===== 디자인 토큰 (4px 격자, 글자 6단계, 모서리 3종) ===== */
:root{
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --fs-xs:13px;--fs-sm:15px;--fs-md:17px;--fs-lg:19px;--fs-xl:24px;--fs-2xl:34px;
  --r-s:6px;--r-m:10px;--r-l:16px;--h-ctl:40px;--h-btn:44px;
  --ui:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --en:'Source Serif 4',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.2,.0,.0,1);
}
:root[data-theme=light]{
  --bg:#f2f0ea;--surface:#ffffff;--surface2:#f7f5ef;--ink:#1d2623;--sub:#58675f;
  --line:rgba(29,38,35,.14);--outline:#78857e;
  --exam:#1a68ab;--exam-ink:#ffffff;--exam-bg:rgba(26,104,171,.10);
  --book:#2b7536;--book-bg:rgba(43,117,54,.10);
  --top:#b8335b;--top-bg:rgba(184,51,91,.10);
  --danger:#a9411a;--hover:rgba(29,38,35,.06);--scrim:rgba(20,28,25,.45);
  --shadow:0 1px 2px rgba(20,28,25,.08),0 8px 24px rgba(20,28,25,.06);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#141718;--surface:#1f2325;--surface2:#191c1e;--ink:#ecebe6;--sub:#a9b2ad;
  --line:rgba(236,235,230,.14);--outline:#8a9690;
  --exam:#8cc4f5;--exam-ink:#0d2a45;--exam-bg:rgba(140,196,245,.14);
  --book:#a9dc8c;--book-bg:rgba(169,220,140,.14);
  --top:#ff9db8;--top-bg:rgba(255,157,184,.16);
  --danger:#ffb98c;--hover:rgba(236,235,230,.08);--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-md)/1.6 var(--ui);word-break:keep-all;line-break:strict;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
button{padding:0}
a{color:var(--exam)}
:focus-visible{outline:2px solid var(--exam);outline-offset:2px;border-radius:var(--r-s)}
html{zoom:var(--zoom,1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--sp-3);top:-60px;background:var(--exam);color:var(--exam-ink);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-m);z-index:100}
.skip:focus{top:var(--sp-3)}
.num{font-variant-numeric:tabular-nums}

/* ===== 앱바 ===== */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--sp-4);height:64px;padding:0 var(--sp-5);background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-lg);font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-m);background:var(--exam);color:var(--exam-ink);font-style:normal;font-size:var(--fs-sm);font-weight:800}
.nav{display:flex;gap:var(--sp-1);height:100%;margin-left:var(--sp-3)}
.nav a{display:flex;align-items:center;white-space:nowrap;padding:0 var(--sp-4);color:var(--sub);text-decoration:none;font-size:var(--fs-sm);font-weight:600;border-bottom:3px solid transparent;margin-top:3px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--exam)}
.grow{flex:1}
.search{position:relative;width:min(360px,30vw)}
.search input{width:100%;height:var(--h-ctl);padding:0 var(--sp-4) 0 var(--sp-5);border:1px solid var(--outline);border-radius:var(--r-m);background:var(--surface);font-size:var(--fs-sm)}
.search input::placeholder{color:var(--sub)}
.search svg{position:absolute;left:var(--sp-3);top:12px;width:16px;height:16px;color:var(--sub);pointer-events:none}
.search input{padding-left:36px}
.ibtn{display:inline-flex;align-items:center;gap:var(--sp-2);height:var(--h-ctl);min-width:var(--h-ctl);padding:0 var(--sp-3);border:1px solid var(--outline);border-radius:var(--r-m);background:var(--surface);cursor:pointer;font-size:var(--fs-sm);font-weight:600}
.ibtn:hover{background:var(--hover)}
.ibtn .cnt{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--exam);color:var(--exam-ink);font-size:var(--fs-xs);font-weight:700}

/* ===== 버튼·태그·칩 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:var(--h-btn);padding:0 var(--sp-4);border-radius:var(--r-m);border:1px solid var(--outline);background:var(--surface);cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--exam);border-color:var(--exam);color:var(--exam-ink)}
.btn.primary:hover{filter:brightness(.94)}
.btn.sm{height:var(--h-ctl);padding:0 var(--sp-3)}
.btn.text{border-color:transparent;background:transparent}
.btn.text:hover{background:var(--hover)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn.book{color:var(--book);border-color:var(--book)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 var(--sp-2);border-radius:var(--r-s);background:var(--hover);color:var(--ink);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.tag.lk{background:var(--book-bg);color:var(--book)}
.tag.top{background:var(--top-bg);color:var(--top)}
.chip{display:inline-flex;align-items:center;height:var(--h-ctl);padding:0 var(--sp-3);border-radius:20px;border:1px solid var(--outline);background:var(--surface);cursor:pointer;font-size:var(--fs-sm);font-weight:600}
.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--exam-bg);border-color:var(--exam);color:var(--exam)}
.seg{display:inline-flex;padding:var(--sp-1);gap:var(--sp-1);border-radius:var(--r-m);background:var(--hover)}
.seg button{height:calc(var(--h-ctl) - 8px);padding:0 var(--sp-4);border:0;border-radius:var(--r-s);background:transparent;cursor:pointer;font-size:var(--fs-sm);font-weight:600;color:var(--sub)}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ===== 첫 화면 ===== */
.home{max-width:1040px;margin:0 auto;padding:var(--sp-7) var(--sp-5)}
.home h1{margin:0;font-size:var(--fs-2xl);line-height:1.25;letter-spacing:-.01em}
.home .lead{margin:var(--sp-2) 0 var(--sp-6);color:var(--sub);font-size:var(--fs-md)}
.stats{display:flex;flex-wrap:wrap;gap:var(--sp-4) var(--sp-6);margin-bottom:var(--sp-6);color:var(--sub);font-size:var(--fs-sm)}
.stats b{display:block;color:var(--ink);font-size:var(--fs-xl);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp-4)}
.tile{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-5);border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;text-align:left;min-height:120px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.tile:hover{border-color:var(--exam);box-shadow:var(--shadow)}
.tile.main{grid-column:span 3;grid-row:span 2;min-height:256px;background:var(--exam);color:var(--exam-ink);border-color:var(--exam)}
.tile.main .t2{color:inherit;opacity:.92}
.tile.s{grid-column:span 3}
.tile.wide{grid-column:span 6}
.tile .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-m);background:var(--hover);margin-bottom:var(--sp-2)}
.tile .ic svg{width:24px;height:24px}
.tile.main .ic{background:rgba(255,255,255,.18)}
.tile.lk .ic{background:var(--book-bg);color:var(--book)}
.tile .t1{font-size:var(--fs-xl);font-weight:700}
.tile .t2{color:var(--sub);font-size:var(--fs-sm);line-height:1.6}
.tile .go{margin-top:auto;font-weight:700;font-size:var(--fs-sm)}
.tile.lk .t1{color:var(--book)}
.resume{display:flex;align-items:center;gap:var(--sp-4);margin-top:var(--sp-5);padding:var(--sp-4) var(--sp-5);border:1px dashed var(--outline);border-radius:var(--r-l)}

/* ===== 탐색 화면 ===== */
.layout{display:grid;grid-template-columns:264px minmax(0,1fr) 336px;gap:var(--sp-5);max-width:1680px;margin:0 auto;padding:var(--sp-5)}
.layout.no-my{grid-template-columns:264px minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--sp-4)}
.panel+.panel{margin-top:var(--sp-4)}
.panel h2{margin:0 0 var(--sp-3);font-size:var(--fs-sm);font-weight:700;color:var(--sub)}
.side{position:sticky;top:80px;align-self:start;max-height:calc((100vh - 96px)/var(--zoom,1));overflow:auto}
select{text-overflow:ellipsis;width:100%;height:var(--h-ctl);padding:0 var(--sp-3);border:1px solid var(--outline);border-radius:var(--r-m);background:var(--surface);font-size:var(--fs-sm)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.types{list-style:none;margin:0;padding:0}
.types button{display:flex;justify-content:space-between;align-items:center;width:100%;height:40px;padding:0 var(--sp-3);border:0;border-radius:var(--r-s);background:transparent;cursor:pointer;font-size:var(--fs-sm);text-align:left}
.types button:hover{background:var(--hover)}
.types button[aria-pressed=true]{background:var(--exam-bg);color:var(--exam);font-weight:700}
.types .n{color:var(--sub);font-size:var(--fs-xs)}
.switch{display:flex;align-items:center;gap:var(--sp-3);cursor:pointer;font-size:var(--fs-sm);font-weight:600}
.switch input{width:24px;height:24px;accent-color:var(--exam)}
.hint{margin:var(--sp-2) 0 0;color:var(--sub);font-size:var(--fs-xs);line-height:1.6}
.main h1{margin:0;font-size:var(--fs-xl);line-height:1.3}
.main .sub{margin:var(--sp-1) 0 0;color:var(--sub);font-size:var(--fs-sm)}
.toolbar{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-4) 0;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:var(--sp-4)}
.card{display:flex;flex-direction:column;border:2px solid transparent;border-radius:var(--r-l);background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.card{transition:box-shadow .15s var(--ease)}
.card:hover{box-shadow:0 0 0 1px var(--outline),var(--shadow)}
.card.picked{border-color:var(--exam)}
.ch{display:flex;align-items:center;gap:var(--sp-2);height:48px;padding:0 var(--sp-4);flex-wrap:nowrap}
.ch .no{font-size:var(--fs-lg);font-weight:700;min-width:28px}
.ch .ty{overflow:hidden;text-overflow:ellipsis}
.ch .sp{flex:1}
.thumb{display:block;position:relative;width:100%;aspect-ratio:4/3;padding:0;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafaf8;overflow:hidden;cursor:zoom-in}
.thumb img{width:100%;display:block;object-fit:cover;object-position:top}
.thumb .txt{display:block;padding:var(--sp-3);font:400 15px/1.6 var(--en),var(--ui);color:#222;text-align:left}
.thumb::after{content:'';position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,#fafaf8)}
.thumb .more{position:absolute;right:var(--sp-3);bottom:var(--sp-2);z-index:1;padding:2px 8px;border-radius:var(--r-s);background:rgba(20,28,25,.78);color:#fff;font-size:var(--fs-xs);font-weight:600}
.cf{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4)}
.cf .btn{height:var(--h-ctl);flex:1}
.cf .btn.primary{flex:1.5}
.cf .btn.text{background:var(--hover)}
.cf .btn[aria-pressed=true]{background:var(--exam-bg);border-color:var(--exam);color:var(--exam)}
.empty{padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--sub);border:1px dashed var(--outline);border-radius:var(--r-l)}
.more-row{display:flex;justify-content:center;margin:var(--sp-5) 0}

/* ===== 내 시험지 ===== */
.my{position:sticky;top:80px;align-self:start;max-height:calc((100vh - 96px)/var(--zoom,1));display:flex;flex-direction:column;padding:0;overflow:hidden}
.my .hd{display:flex;align-items:baseline;justify-content:space-between;padding:var(--sp-4) var(--sp-4) var(--sp-2)}
.my .hd h2{margin:0;font-size:var(--fs-lg);color:var(--ink)}
.my .hd .big{font-size:var(--fs-xl);font-weight:700;color:var(--exam)}
.my .sum{padding:0 var(--sp-4) var(--sp-3);color:var(--sub);font-size:var(--fs-sm)}
.my ol{list-style:none;margin:0;padding:0 var(--sp-2);overflow:auto;flex:1;min-height:80px}
.my li{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-s)}
.my li .k{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r-s);background:var(--exam-bg);color:var(--exam);font-size:var(--fs-xs);font-weight:700}
.my li .g{flex:1;font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.my li .ib{width:40px;height:40px;border:0;border-radius:var(--r-s);background:transparent;cursor:pointer;color:var(--sub)}
.my li .ib:hover{background:var(--hover);color:var(--ink)}
.my li .ib.rm:hover{color:var(--danger)}
.my .set{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line)}
.my details summary{cursor:pointer;font-size:var(--fs-sm);font-weight:700;padding:var(--sp-2) 0;list-style:none}
.my details summary::after{content:' ▾';color:var(--sub)}
.my fieldset{border:0;margin:var(--sp-3) 0 0;padding:0}
.my legend{font-size:var(--fs-xs);color:var(--sub);font-weight:600;margin-bottom:var(--sp-2);padding:0}
.my .row{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.my .chk{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);margin-top:var(--sp-2)}
.my .chk input{width:24px;height:24px;accent-color:var(--exam)}
.my .act{display:grid;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4) var(--sp-4);border-top:1px solid var(--line)}
.my .act .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.my .emp{padding:var(--sp-5) var(--sp-4);color:var(--sub);font-size:var(--fs-sm);line-height:1.7}

/* ===== 서랍(문항 상세)·대화상자 ===== */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(680px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .2s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer .dh{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0;font-size:var(--fs-lg);flex:1}
.drawer .db{overflow:auto;padding:var(--sp-5);flex:1}
.drawer .df{display:flex;gap:var(--sp-2);padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--line)}
.drawer .df .btn{flex:1}
.drawer img{max-width:100%;display:block;border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:var(--sp-3)}
.body{font:400 var(--fs-md)/1.8 var(--en),var(--ui);white-space:pre-wrap}
.qb{margin-top:var(--sp-5);padding-top:var(--sp-4);border-top:1px solid var(--line)}
.qb .stem{font-weight:700;margin-bottom:var(--sp-2)}
.qb .ch2{display:block;padding:var(--sp-1) 0}
.qb .ch2.a{color:var(--exam);font-weight:700}
.bars{display:flex;gap:var(--sp-2);align-items:flex-end;height:72px;margin:var(--sp-5) 0 var(--sp-1)}
.bars .b{flex:1;position:relative;border-radius:var(--r-s) var(--r-s) 0 0;background:var(--hover);min-height:2px}
.bars .b.a{background:var(--exam)}
.bars .b span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:var(--fs-xs);color:var(--sub)}
.lkbox{margin:var(--sp-4) 0;padding:var(--sp-4);border:1px solid var(--line);border-left:4px solid var(--book);border-radius:var(--r-m);background:var(--book-bg);font-size:var(--fs-sm);line-height:1.7}
.lkbox b.t{color:var(--book)}
.dlg{position:fixed;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);padding:var(--sp-5);display:none}
.dlg.on{display:block}
.dlg h2{margin:0 0 var(--sp-1);font-size:var(--fs-xl)}
.dlg .sub{margin:0 0 var(--sp-4);color:var(--sub);font-size:var(--fs-sm)}
.steps{display:flex;gap:var(--sp-2);margin:var(--sp-4) 0}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--hover)}
.steps span.on{background:var(--exam)}
.opt{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3) var(--sp-4);border:1px solid var(--outline);border-radius:var(--r-m);margin-bottom:var(--sp-2);cursor:pointer}
.opt input{margin-top:3px;width:24px;height:24px;flex:none;accent-color:var(--exam)}
.opt:has(input:checked){border-color:var(--exam);background:var(--exam-bg)}
.opt b{display:block;font-size:var(--fs-md)}
.opt small{color:var(--sub);font-size:var(--fs-sm)}
.opt.dis{opacity:.55;cursor:not-allowed}
.dlg .acts{display:flex;justify-content:space-between;gap:var(--sp-2);margin-top:var(--sp-5)}
table.t{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
table.t th{color:var(--sub);font-weight:600;text-align:left;font-size:var(--fs-xs)}
table.t tbody th{font-size:var(--fs-sm);color:var(--ink);font-weight:700;text-align:left}
table.t th,table.t td{padding:var(--sp-3) var(--sp-2);border-bottom:1px solid var(--line);vertical-align:middle}
table.t select{height:36px;width:auto;min-width:120px}
.page{max-width:1440px;margin:0 auto;padding:var(--sp-6) var(--sp-5)}
.page h1{margin:0 0 var(--sp-1);font-size:var(--fs-2xl);line-height:1.25}
.page .lead{margin:0 0 var(--sp-5);color:var(--sub)}
.deck{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-5);border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);margin-bottom:var(--sp-3)}
.deck .g{flex:1}.deck b{font-size:var(--fs-md)}
.bar2{display:inline-block;height:8px;border-radius:4px;background:var(--exam);vertical-align:middle;margin-right:var(--sp-2)}
.toast{position:fixed;left:50%;bottom:var(--sp-5);transform:translateX(-50%);z-index:80;padding:var(--sp-3) var(--sp-5);border-radius:var(--r-m);background:var(--ink);color:var(--bg);font-size:var(--fs-sm);font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
.mybar{display:none}
.fbtn{display:none}

/* ===== 반응형 ===== */
@media (max-width:1279px){
  .nav a:first-child{display:none}.nav a{padding:0 var(--sp-3)}
  .layout,.layout.no-my{grid-template-columns:240px minmax(0,1fr)}
