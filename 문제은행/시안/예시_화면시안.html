<style>
:root{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif}
body{background:#f8fafc;color:#1e293b;font-size:15px;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.sticky-header th{position:sticky;top:0;z-index:10;background:#f8fafc;white-space:nowrap}
.row-selected{background:#eff6ff!important}.row-selected td:first-child{box-shadow:inset 3px 0 0 #2563eb}
.cbx{appearance:none;background:#fff;margin:0;width:18px;height:18px;border:1.5px solid #94a3b8;border-radius:4px;display:grid;place-content:center;cursor:pointer;flex:none;transition:all .15s}
.cbx::before{content:"";width:9px;height:9px;transform:scale(0);transition:120ms transform;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%)}
.cbx:checked{background:#2563eb;border-color:#2563eb}.cbx:checked::before{transform:scale(1)}
.cbx:indeterminate{background:#2563eb;border-color:#2563eb}.cbx:indeterminate::before{transform:scale(1);clip-path:inset(40% 10%)}
.rad{appearance:none;width:14px;height:14px;border:1.5px solid #94a3b8;border-radius:50%;flex:none;cursor:pointer}.rad:checked{border:4.5px solid #2563eb}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.seg button[aria-pressed=true]{background:#fff;color:#1e293b;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.a4{width:100%;max-width:380px;aspect-ratio:210/297;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:26px 28px;font-size:12px;overflow:hidden;color:#1a1a1a}

/* 실제 모의고사 문제지 */
.xp{position:relative;flex:none;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);color:#111;font-family:'Times New Roman','Noto Serif KR',serif;overflow:hidden}
.xp .xhd{text-align:center;border-bottom:3px double #111;padding-bottom:6px;margin-bottom:8px}
.xp .xhd .t1{font-size:10px;letter-spacing:.02em}

.xp .xhd .kyo{border:1.5px solid #111;border-radius:999px;padding:3px 8px;font:700 10px 'Noto Serif KR',serif}
.xp .xhd .who{display:flex;justify-content:space-between;margin-top:6px;font:400 9.5px 'Noto Serif KR',serif}
.xp .xhd .who span{display:inline-flex;align-items:center;gap:4px}.xp .xhd .who i{display:inline-block;width:70px;height:14px;border:1px solid #111}
.xp .xpg{position:absolute;top:10px;font:900 20px 'Times New Roman',serif}
.xp .xcols{display:flex}.xp .xcol{display:flex;flex-direction:column}.xp .xcol+.xcol{border-left:1px solid #111}
.xq{font-size:12.5px;line-height:1.52;margin-bottom:10px;text-align:justify;word-break:keep-all}
.xq .qn{font-weight:700;font-size:11px;margin-right:2px}
.xq .st{font-family:'Noto Serif KR',serif}.xq u{text-decoration:underline;text-underline-offset:2px}
.xq .bd{margin:4px 0 4px 6px;text-indent:.8em;white-space:pre-wrap}
.xq .ch{margin:3px 0 0 6px;display:grid;grid-template-columns:1fr;gap:1px}.xq .ch.short{grid-template-columns:1fr 1fr 1fr}
.xq .gh{font-family:'Noto Serif KR',serif;margin-bottom:3px}
.xq img{width:100%;display:block;margin-top:3px}
.xp .xft{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:700 11px 'Times New Roman',serif}
.xp .xft small{display:block;font:400 7.5px 'Noto Serif KR',serif;color:#444;margin-top:2px}
.xp .xsec{font:700 10px 'Noto Serif KR',serif;margin:0 0 6px}

/* 실제 모의고사 문제지(2026-10-30, 평가원 문제지 참고) */
.xp .xh1{border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:0}
.xp .xh1 .xt{text-align:center;font:500 13px 'Noto Sans KR','Pretendard Variable',sans-serif;letter-spacing:-.01em}
.xp .xh1 .xr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:4px}
.xp .xh1 .xr b{font:900 30px/1.1 'Noto Sans KR','Pretendard Variable',sans-serif;letter-spacing:.02em}
.xp .kyo{justify-self:start;border:1.5px solid #111;border-radius:999px;padding:2px 10px;font:700 11px 'Noto Serif KR',serif}
.xp .xnb{display:flex;justify-content:flex-end;gap:4px;margin-top:5px}.xp .xnb span{min-width:46px;padding:1px 4px;border:1px solid #111;font:400 9px 'Noto Serif KR',serif}
.xp .xhn{position:relative;text-align:center;border-bottom:2px solid #111;padding-bottom:4px}
.xp .xtype{display:inline-block;border:2.5px double #111;border-radius:4px;padding:0 6px;font:900 14px/1.4 'Noto Sans KR',sans-serif}
.xq .ch{line-height:1.8}.xq .gh{font-family:'Noto Sans KR',sans-serif;font-weight:500}.xp .xhn b{font:900 22px/1.2 'Noto Sans KR','Pretendard Variable',sans-serif}
.xp .xpn{position:absolute;top:18px;font:700 26px/1 'Times New Roman',serif}
.xp .xcols{display:flex;padding-top:0;margin-top:8px}   /* 단 높이를 잰 값과 똑같이: 위 여백을 단 안에 넣으면 8px 넘침 */.xp .xcol{display:flex;flex-direction:column;gap:18px}
.xp .xcol+.xcol{border-left:1px solid #111}
.xq .sq{margin-top:8px}
.xbox{border:1px solid #111;padding:6px 8px;font:400 10px/1.5 'Noto Sans KR',sans-serif;text-align:center}
.xans{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 6px}
.xp .xft{position:absolute;bottom:10px;left:0;right:0;text-align:center}
.xp .xfr{display:inline-flex;align-items:center;border:1px solid #111;font:700 10px 'Times New Roman',serif;position:relative;height:16px}
.xp .xfr i{font-style:normal;padding:0 6px}.xp .xfr::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#111;transform:rotate(35deg)}
.xp .xft small{position:absolute;right:30px;bottom:2px;font:400 8px 'Noto Sans KR',sans-serif;color:#333}
.xcover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}.xcover b{font:900 30px 'Noto Sans KR',sans-serif}.xcover .kyo{justify-self:auto;font-size:16px}


/* 문제지 다듬기(2026-10-30 제이님 지적 1~5): 글꼴 한 벌, 번호·선지 내어쓰기, 각주 오른쪽 */
@font-face{font-family:'ExamLatin';src:local('Times New Roman'),local('TimesNewRomanPSMT');unicode-range:U+0000-024F,U+2010-2027}
.xp,.xp .xq,.xp .xq .st,.xp .xq .gh,.xp .xq .ch,.xp .xq .bd{font-family:'ExamLatin','Noto Serif KR',serif}
.xq{padding-left:1.7em;text-align:left}
.xq .qn{display:inline-block;width:1.7em;margin-left:-1.7em;margin-right:0;font-size:inherit}
.xq>.gh{margin-left:-1.7em;font-weight:400}
.xq .bd{margin:4px 0 4px 0;text-align:justify}
.xq .ch{margin:3px 0 0 0;text-align:left}
.xq .ch span{display:block;padding-left:1.35em;text-indent:-1.35em}
.pv-b{display:flow-root}
.xq .xim{overflow:hidden;margin-top:3px}.xq .xim img{margin-top:0}
.xq .sumbox{margin:6px 0 4px;padding:6px 8px;border:1px solid #111;text-align:justify}
.xq .fn{text-align:right;margin:0 0 2px;font-size:.92em;white-space:normal;text-indent:0}
.xp .xh1 .xr .xqr2{justify-self:end;display:flex;flex-direction:column;align-items:center;font:700 9px 'Noto Sans KR',sans-serif}
.xp .xh1 .xr .xqr2 svg{width:54px;height:54px}
/* 교사용·QR (2026-10-30) */
.xq .ch span.ok{color:#dc2626;font-weight:700;text-decoration:underline}
/* ===== 실측 서식 (2026-10-30) — 2026학년도 9월 모평 PDF를 pdfplumber로 잰 값. 시험지 1pt = 이 쪽 1.0214px(842pt→860px).
   본문 영문 12.2pt(12.46px)·한글 11.5pt(×0.943)·각주 11pt(×0.9). 영문 줄 간격 17.3pt(×1.416), 발문 줄 간격 19.5pt.
   번호는 단 왼쪽 끝, 발문 둘째 줄·지문·선지는 11.3pt(0.93em) 들여, 지문 첫 줄은 10.5pt(0.86em) 더.
   지문→선지 7.6pt(0.62em) 더 띄움. 각주는 단 오른쪽 끝에 맞춤.
   장문: 지문은 단 너비 상자(안쪽 8.6pt), 상자 안 줄 간격 16.1pt(×1.32), 43~45는 (A)~(D) 이름표를 상자 위 가운데에. ===== */
.xq{font-size:12.46px;line-height:var(--lh,1.461);padding-left:.93em;margin-bottom:0;text-align:left}
.xq .qn{display:inline;width:auto;margin:0 .22em 0 -.93em;font-weight:700;font-size:1em}
.xq .st{font-size:.943em;line-height:1.7}
.xq .bd{margin:4.8px 0 0;text-indent:.4em;text-align:justify;white-space:pre-wrap}
.xq .fn{font-size:.9em;text-align:right;margin:.1em 0 0;text-indent:0}
.xq .ch{margin:.62em 0 0;display:grid;grid-template-columns:1fr;column-gap:.6em;row-gap:0;line-height:var(--lh,1.461)}
.xq .ch.c2{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:.8em}
.xq .ch.c3{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:.6em}
.xq .ch.c5{grid-template-columns:repeat(5,minmax(0,1fr));column-gap:.4em}
.xq .ch.ko span{font-size:.943em;line-height:calc(var(--lh,1.461) * 1.06)}
.xq .ch span{display:block;padding-left:1.25em;text-indent:-1.25em}
.xq .gh{margin-left:-.93em;font-size:1em;font-weight:400;line-height:1.6}
.xq .glab{display:block;margin:16.3px 0 4.1px -11.59px;text-align:center;font-size:.943em;line-height:1.2}
.xq .gbox{margin:.45em -.1px 0 -11.75px;border:1px solid #111;padding:.42em 8px .35em;line-height:calc(var(--lh,1.461) * .932)}
.xq .glab+.gbox{margin-top:0}
.xq .gbox .bd{margin:0;text-indent:.4em}
.xq .gbox .fn{margin-top:.15em}
.xq .fn+.ch,.xq .fn+.sumbox{margin-top:8.1px}
.xq.gq{padding-top:.25em}
.xq.gc{margin-top:-18px}
.xcol>.xq.gc:first-child,.pv-b .xq.gc{margin-top:0}
/* 장문 한 단에 넣기(학생용): 실제 시험지보다 조금씩 줄이는 단계. fit1이 가장 작게 줄임 */
.xq.xg .sq{margin-top:1.25em}
.xq.xg .glab{margin-top:12px}
.xq.xg.q2 .sq+.sq{margin-top:2.5em}.xq.xg.q2.fit1 .sq+.sq{margin-top:2em}.xq.xg.q2.fit2 .sq+.sq{margin-top:1.5em}.xq.xg.q2.fit3 .sq+.sq{margin-top:1.2em}.xq.xg.q2.fit4 .sq+.sq{margin-top:1em}
/* 2026-10-30 제이님: 장문만 글자가 작아 보여 이상함 → 글자 크기는 그대로 두고 줄 간격·여백부터 줄인다. 글자는 fit5·fit6(마지막 수단)에서만 */
.xq.xg.fit1 .glab{margin-top:9px}.xq.xg.fit1 .sq{margin-top:1em}
.xq.xg.fit2 .glab{margin-top:6px;margin-bottom:2px}.xq.xg.fit2 .sq{margin-top:.75em}.xq.xg.fit2 .ch{margin-top:.4em}.xq.xg.fit2 .gbox{padding-top:.3em;padding-bottom:.25em}
.xq.xg.fit3 .glab{margin-top:4px;margin-bottom:1px}.xq.xg.fit3 .sq{margin-top:.6em}.xq.xg.fit3 .ch{margin-top:.3em}.xq.xg.fit3 .gbox{padding-top:.25em;padding-bottom:.2em;line-height:1.25}
.xq.xg.fit4 .glab{margin-top:3px;margin-bottom:1px}.xq.xg.fit4 .sq{margin-top:.5em}.xq.xg.fit4 .ch{margin-top:.25em}.xq.xg.fit4 .gbox{padding-top:.2em;padding-bottom:.15em;line-height:1.2}   /* 첫 쪽에 장문만 있을 때만 쓰는 마지막 단계 */
   /* 묶음 지문의 다음 상자: 단 안 문항 간격(18px)을 빼고 이름표 간격만 */
.xq .blk{display:inline-block;width:11em;border-bottom:1px solid #111;height:1em;vertical-align:-.15em}
.xq .blk2{display:inline-block;border-bottom:1px solid #111;padding:0 2.4em;line-height:1.1}
.xq .sumbox{margin:.6em 0 0;padding:.4em .6em;border:1px solid #111;text-align:justify;text-indent:0}
.xq img,.xq .xim{margin-top:.35em}

.xexp{margin-top:6px;padding:5px 8px;border:1px solid #fca5a5;background:#fef2f2;color:#7f1d1d;font:400 10.5px/1.55 'Noto Sans KR',sans-serif;text-align:left}
.xexp b{color:#dc2626;margin-right:4px}
.xp .xqr{position:absolute;top:14px;display:flex;flex-direction:column;align-items:center;font:700 9px 'Noto Sans KR',sans-serif}
.xp .xqr svg{width:58px;height:58px}
.cover-img{width:100%;aspect-ratio:384/485;object-fit:cover;border-radius:6px;border:1px solid #e2e8f0}


/* 2026-10-30: 주어진 글 상자(순서·삽입), 순서 단락 간격, 영어 지문 낱말 나누기(양쪽 맞춤에서 한 줄만 크게 벌어지는 것 줄이기) */
.xq .given{margin:.5em 0 .35em;padding:.35em .6em;border:1px solid #111;text-align:justify;text-indent:.4em;hyphens:auto;-webkit-hyphens:auto}
.xq .opara{margin-top:.3em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.xq .bd,.xq .gbox .bd{hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3}

/* 안내문 글자 조판(2026-10-30): 본문과 같은 글꼴·크기·줄 간격, 1px 상자 */
.xq .ntc{margin:.5em 0 0;padding:.45em .75em .5em;border:1px solid #111;border-radius:6px}
.xq .ntt{text-align:center;font-family:'Arial Black','Noto Sans KR',sans-serif;font-weight:900;margin-bottom:.25em}
.xq .ntp{text-indent:.4em;text-align:justify}
.xq .nth{font-weight:700;margin-top:.25em}
.xq .ntkv{margin-top:.1em}
.xq .ntli{padding-left:.9em;text-indent:-.9em}.xq .ntli.l2{padding-left:1.9em}
.xq .ntb{width:100%;border-collapse:collapse;margin:.25em 0;font-size:.95em;line-height:1.3}
.xq .ntb th,.xq .ntb td{border:1px solid #111;padding:.1em .35em;text-align:center;font-weight:400}
/* 줄 간격은 세 종류만(실측 그대로): 본문 18.2px(17.3pt) · 발문·묶음 머리 20px(19.5pt) · 상자·표·이름표 16.4px(16.1pt). 글자 크기도 세 종류: 12.46 · 11.75(한글) · 11.2(각주) */
.xq .fn{line-height:18.2px}.xq .gbox .fn{line-height:16.9px}
.xq .gh{line-height:20.6px}.xq .st{line-height:20.6px}
.xq .glab{line-height:16.9px}
.xq .blk2{line-height:inherit}
.xq .ntb{font-size:1em;line-height:16.9px}

/* 2026-10-30 제이님: 머리·쪽 번호를 실제 시험지(2026.09 PDF) 실측 크기로 */
.xp .xh1{position:relative;height:103px;border-bottom:1.5px solid #111;padding:0;margin:0}
.xp .xh1 .xt{position:absolute;left:0;right:0;top:-2px;text-align:center;font:400 21px/1 'Noto Sans KR','Pretendard Variable',sans-serif;letter-spacing:0}
.xp .xh1 .kyo{position:absolute;left:0;top:41px;width:93px;height:32px;box-sizing:border-box;border:1.2px solid #111;border-radius:16px;padding:0;display:flex;align-items:center;justify-content:center;font:700 17px/1 'Noto Serif KR',serif;letter-spacing:-.02em}
.xp .xh1 .xbig{position:absolute;left:0;right:0;top:35px;text-align:center}
.xp .xh1 .xbig b{position:relative;display:inline-block;font:900 42px/1 'Noto Sans KR','Pretendard Variable',sans-serif;letter-spacing:0}
.xp .xh1 .xqr2{position:absolute;left:100%;margin-left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:1px}
.xp .xh1 .xqr2 svg{width:62px;height:62px;display:block}
.xp .xh1 .xqr2 i{font:700 8px/1 'Noto Sans KR',sans-serif;font-style:normal;white-space:nowrap;letter-spacing:0}
.xp .xnb{margin-top:5px}
.xp .xhn{position:relative;height:36px;border-bottom:1.5px solid #111;padding:0;text-align:center}
.xp .xhn b{position:absolute;left:0;right:0;top:-2.5px;font:900 29px/1 'Noto Sans KR','Pretendard Variable',sans-serif}
.xp .xpn{font:700 36px/1 'Times New Roman',serif}
.xp .xft{bottom:12px}
.xp .xfr{display:inline-block;position:relative;width:52px;height:23px;box-sizing:border-box;border:1px solid #111;background:linear-gradient(to bottom right,transparent calc(50% - .6px),#111 calc(50% - .4px),#111 calc(50% + .4px),transparent calc(50% + .6px));font:400 12.3px/1 'Times New Roman',serif}
.xp .xfr::after{display:none}
.xp .xfr i{position:absolute;padding:0;font-style:normal}.xp .xfr i:first-child{left:4px;top:1px}.xp .xfr i:last-child{right:4px;bottom:1px}
/* 요약문: 지문 → 화살표 → 요약문 상자((A)(B)는 밑줄 빈칸) → (A)(B) 선지 표. 2026.09 40번 실측 */
.xq .sarr{display:flex;justify-content:center;margin:.35em 0 .3em}.xq .sarr svg{width:12px;height:13px;display:block}
.xq .sumbox{margin:0;padding:.3em .7em .35em;border:1px solid #111;border-radius:0;text-align:justify;text-indent:0;line-height:18.2px}
.xq .sblk{display:inline-block;min-width:4.9em;border-bottom:1px solid #111;text-align:center;line-height:1.05;margin:0 .1em}
.xq table.sch{border-collapse:collapse;margin:.45em 0 0 .25em;line-height:18.2px}
.xq table.sch td,.xq table.sch th{padding:0;font-weight:400;white-space:nowrap;vertical-align:baseline}
.xq table.sch th{text-align:center}
.xq table.sch .n{padding-right:.3em}.xq table.sch .d{padding:0 .3em;letter-spacing:-.05em}.xq table.sch .g{width:1.2em}
.xq table.sch .ok{color:#dc2626;font-weight:700}

/* 안내문 2차(2026-10-30 제이님 '형식이 무너짐'): 네모 상자, 글머리 •·- 매달린 들여쓰기, 이름표 값 줄 맞춤 */
.xq .ntc{border-radius:0;padding:.5em .8em .55em}
.xq .ntt.hp{font-family:inherit;font-weight:400;font-size:1.06em}
.xq .ntli{position:relative;padding-left:1.7em;text-indent:0}.xq .ntli.l2{padding-left:2.5em}
.xq .ntli>i:first-child{position:absolute;left:.75em;font-style:normal}.xq .ntli.l2>i:first-child{left:1.55em}
